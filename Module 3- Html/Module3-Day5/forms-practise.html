<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <title>Coffee-Shop order slip </title>
        <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
        <style>form { border: 1px solid #ccc; padding: 20px; } input { margin-bottom: 10px; }</style>
    </head>
    <body> .
        <header>
            <h1>Order Here</h1>
            <p>This is a simple order form.</p>
        </header>

        <section>
        <form>
            <label for="name">Name:</label>
            <input type="text" 
                   id="name" 
                   name="name"><br><br>

            <label for="surname">Surname:</label>
            <input type="text" 
            id="surname" 
            name="surname"><br><br> 

            <label for="email">Email:</label>
            <input type="email" 
            id="email" 
            name="email"><br><br>

            <label for="number">Phone Number:</label>
            <input type="tel"
             id="number" 
             name="number"><br><br>

            <label for="Name">"Coffee Type:</label>
            <select checkbox
            id="Name" name="Coffee"> 
                <option>Espresso</option>
                <option>Cuppuccino</option>
                <option>Late</option>
                <option>Mocha</option>
                <option>Americano</option>
                <br><br>
            <label for="message">Extras</label>
            
        
 

            type="submit" value="Submit">
            <input type="reset" value="Reset">
        </form>
        </section>
    </body>
</html>
